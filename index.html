<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/navbar.css">
    <link rel="stylesheet" href="./css/index.css">
    <title>HOME</title>

</head>

<body>
    <div id="navbarGeneral"></div>
    <section>
        <form class="formulario-tarea">
            <div class="form-group">
                <label for="exampleInputEmail1"> Nombre </label>
                <input type="text" class="form-control" id="nombreTarea" aria-describedby="emailHelp"
                    placeholder="Ingrese su nombre">
            </div>
            <div class="form-group">
                <label for="fechaEntrega">Fecha de entrega de la tarea</label>
                <input type="date" class="form-control" id="fechaEntrega">
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1"> ¿la tarea ha sido entregada?</label>
            </div>
            <div>
                <label for="descripcionTarea" id="descripcionTarea"> descripcion </label>
            </div>
            <div>
                <textarea id="descripcionTarea"></textarea>
            </div>
            <div class="d-flex justify-content-center">
                <button type="submit" id="btnPublicarTarea" class="btn btn-primary text-center">
                    Publica tu tarea
                </button>
            </div>
        </form>
    </section>
    <section>
        <div class="card" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Nombre de la tarea</h5>
                <h6 class="card-subtitle mb-2 text-muted">descripcion</h6>
                <p class="card-text">Some quick example text to build on the card title and make up the bulk of the
                    card's
                    content.</p>
                <a href="#" class="card-link">Card link</a>
                <a href="#" class="card-link">Another link</a>
            </div>
        </div>
    </section>
    <script src="./js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
